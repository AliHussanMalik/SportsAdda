version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsadda_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: sports_adda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportsadda_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportsadda_backend
    environment:
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: rootpassword
      PGDATABASE: sports_adda
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production_sportsadda_jwt_secret_key_2026
      REFRESH_SECRET: production_sportsadda_refresh_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
